[package]
name = "dragon-browser"
version = "0.1.0"
edition = "2021"
description = "A lightweight, content-first browser prototype"
license = "MIT"
authors = ["Dragon Browser contributors"]

[package.metadata.deb]
maintainer = "Dragon Browser contributors <dragon-browser@users.noreply.github.com>"
section = "utils"
priority = "optional"

[lib]
name = "dragon_core"
path = "src/lib.rs"

[[bin]]
name = "dragon-browser"
path = "src/main.rs"

[dependencies]
boa_engine = "0.22"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
html5ever = "0.27"
markup5ever_rcdom = "0.3"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
url = "2.5"
